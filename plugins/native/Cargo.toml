[package]
name = "remdia-backend-native"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[features]
# Static registration keeps factory symbols private inside the host.
builtin = []

[lib]
crate-type = ["rlib"]

[dependencies]
anyhow.workspace = true
remdia-bitstream = { path = "../../crates/remdia-bitstream", version = "0.3.0" }
serde_json.workspace = true
remdia-graph.workspace = true
remdia-plugin-abi.workspace = true

[target.'cfg(target_os = "android")'.dependencies]
libc = "0.2"
