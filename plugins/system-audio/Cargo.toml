[package]
name = "remdia-backend-system-audio"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
anyhow.workspace = true
serde_json.workspace = true
remdia-graph.workspace = true
remdia-plugin-abi.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
libloading = "0.8"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", features = ["Win32_Media_MediaFoundation", "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_Foundation"] }
