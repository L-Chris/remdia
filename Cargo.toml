[workspace]
resolver = "2"
members = ["crates/*", "plugins/*"]
default-members = ["crates/*"]

[workspace.package]
version = "0.3.0"
edition = "2024"
license = "MIT"
rust-version = "1.89"
repository = "https://github.com/L-Chris/remdia"

[workspace.dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
remdia-types = { path = "crates/remdia-types", version = "0.3.0" }
remdia-buffer = { path = "crates/remdia-buffer", version = "0.3.0" }
remdia-plugin-abi = { path = "crates/remdia-plugin-abi", version = "0.3.0" }
remdia = { path = "crates/remdia", version = "0.3.0" }
remdia-graph = { path = "crates/remdia-graph", version = "0.3.0" }

[profile.release]
lto = true
codegen-units = 1
strip = "symbols"
