[package]
name = "remdia-sdk"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = ["bundled", "android-src"]
bundled = ["remdia/bundled"]
android-src = ["remdia/builtin-src"]

[dependencies]
anyhow.workspace = true
serde_json.workspace = true
remdia.workspace = true
remdia-graph.workspace = true
remdia-plugin-abi.workspace = true

[target.'cfg(target_os = "android")'.dependencies]
remdia-android-platform = { path = "../remdia-android-platform" }
jni = { version = "0.21.1", default-features = false }
